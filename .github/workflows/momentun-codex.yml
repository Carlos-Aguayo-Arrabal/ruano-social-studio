# Orquestador sin llamadas a API de IA ni claves. Revisión humana obligatoria.
# Solo genera un prompt en Actions; nunca lo ejecuta en Codex ni modifica código.
name: Momentun - prompts gratuitos
on:
  workflow_dispatch:
  schedule:
    - cron: '19 8 * * *'
permissions:
  contents: read
  pull-requests: read
  actions: read
concurrency:
  group: momentun-free-${{ github.repository }}
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Leer PR y producir propuesta
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PROJECT_NAME: "Social Studio"
          PHASE: "0.5"
          OBJECTIVE: "Preparar staging sintético y realizar prueba prolongada de memoria RSS; revisar TLS, volúmenes y recuperación sin acceder a infraestructura real."
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 - <<'PY'
          import json,os,urllib.request
          from datetime import datetime, timezone
          repo=os.environ['GH_REPO']
          req=urllib.request.Request(
            'https://api.github.com/repos/'+repo+'/pulls?state=open&per_page=60',
            headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                     'Accept':'application/vnd.github+json','User-Agent':'momentun-audit'})
          with urllib.request.urlopen(req,timeout=25) as response:
            pulls=json.load(response)
          draft=[p for p in pulls if p.get('draft')]
          lines=['# Propuesta automática, NO ejecutada en Codex',
                 'Proyecto: '+os.environ['PROJECT_NAME'],
                 'Generado (UTC): '+datetime.now(timezone.utc).isoformat(),
                 'Fase de referencia: '+os.environ['PHASE'],'',
                 '## PR en borrador']
          for p in draft:
            lines.append('- #'+str(p['number'])+' '+p['title']+' · '+p['html_url']+' · '+p['head']['sha'][:12])
          lines += ['', '## Prompt propuesto para revisión',
                    'Trabaja en una rama independiente de '+repo+'.',
                    os.environ['OBJECTIVE'],
                    'Antes de continuar, revisa los últimos commits, CI y bloqueos; no des por terminada ninguna fase solo por existir una PR.',
                    'Incluye evidencia reproducible, resultados de pruebas y una PR en borrador.',
                    'No tocar main, VPS, producción, secretos ni datos reales; no fusionar, desplegar ni generar gastos.',
                    '', 'Esta propuesta está generada mediante reglas fijas. No equivale a una revisión técnica con IA.']
          with open('artifacts/siguiente-prompt.md','w') as fp:fp.write('\n'.join(lines)+'\n')
          PY
      - name: Guardar propuesta
        uses: actions/upload-artifact@v4
        with:
          name: momentun-siguiente-prompt
          path: artifacts/siguiente-prompt.md
          retention-days: 7
