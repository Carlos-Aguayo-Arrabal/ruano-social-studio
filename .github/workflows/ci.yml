name: Security regressions
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - name: Verify and record single-replica constraint
        run: node scripts/probe-replicas.mjs
      - name: Dependency audit (all severities block)
        run: npm audit --json > npm-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-node-${{ matrix.node }}
          path: |
            npm-audit.json
            artifacts/replica-results.json

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build production-dependency image (no registry publication)
        run: docker build -t ruano-staging-check .
      - name: Isolated startup, health, permissions and restart tests
        run: node scripts/test-docker.mjs ruano-staging-check
      - name: Bounded synthetic file and concurrency resource tests
        run: node scripts/test-resources.mjs ruano-staging-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-synthetic-results
          path: artifacts/*.json
