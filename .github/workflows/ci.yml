name: Security regressions
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      # H04 remains tracked until the separately proposed Nodemailer upgrade.
      # Report it visibly without disguising security-regression test failures.
      - name: Dependency audit (known Nodemailer finding)
        continue-on-error: true
        run: npm audit --json > npm-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-node-${{ matrix.node }}
          path: npm-audit.json
