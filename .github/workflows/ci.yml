name: Security regressions
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - name: Verify and record single-replica constraint
        run: node scripts/probe-replicas.mjs
      - name: Dependency audit (all severities block)
        run: npm audit --json > npm-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-node-${{ matrix.node }}
          path: |
            npm-audit.json
            artifacts/replica-results.json

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build production-dependency image (no registry publication)
        run: |
          docker pull node:22-alpine
          ruano_stage_base=$(docker image inspect --format '{{index .RepoDigests 0}}' node:22-alpine)
          docker build --build-arg "NODE_IMAGE=$ruano_stage_base" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t ruano-staging-check .
          printf 'RUANO_BASE_REF=%s\n' "$ruano_stage_base" >> "$GITHUB_ENV"
      - name: Isolated startup, health, permissions and restart tests
        run: node scripts/test-docker.mjs ruano-staging-check
      - name: Bounded synthetic file and concurrency resource tests
        run: node scripts/test-resources.mjs ruano-staging-check
      - name: Synthetic stability, disk growth and offline recovery (extended on marked push)
        env:
          SOAK_PHASE_SECONDS: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[staging-long]') && '300' || '60' }}
          SOAK_IDLE_SECONDS: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[staging-long]') && '120' || '0' }}
        run: node scripts/test-soak.mjs ruano-staging-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-synthetic-results
          path: artifacts/*.json


  replay_synthetic_evidence:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[staging-evidence]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    strategy:
      matrix:
        run_id: [40217906593, 40217901995]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: docker-synthetic-results
          path: replayed
          run-id: ${{ matrix.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Read only public image provenance from the synthetic run logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPLAY_RUN_ID: ${{ matrix.run_id }}
        run: |
          ruano_docker_job=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REPLAY_RUN_ID/jobs" --jq '.jobs[]|select(.name=="docker")|.id')
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$ruano_docker_job/logs" > replayed/docker.log
          python scripts/read-build-provenance.py replayed/docker.log "$REPLAY_RUN_ID"
      - run: node scripts/analyze-soak-report.mjs replayed/soak-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostic-analysis-${{ matrix.run_id }}
          path: |
            artifacts/replayed-soak-analysis.json
            artifacts/replayed-build-provenance.json
